    - data:
        code: "import json, re\n\ndef main(arg1: str) -> dict:\n    s = arg1.strip()\n\
          \    # 去掉开头的 ```json 或 ``` 和结尾的 ```\n    s = re.sub(r\"^```(json)?\", \"\
          \", s).strip()\n    s = re.sub(r\"```$\", \"\", s).strip()\n    # 只截取第一个\
          \ { 到最后一个 } 之间的内容\n    start = s.find(\"{\")\n    end = s.rfind(\"}\")\n\
          \    if start != -1 and end != -1:\n        s = s[start:end + 1]\n    #\
          \ 解析校验，确保是合法 JSON 且字段齐全\n    data = json.loads(s)\n    for k in [\"title\"\
          , \"body\", \"tags\", \"cards\"]:\n        if k not in data:\n         \
          \   raise ValueError(\"缺少字段: \" + k)\n\n    # 生成格式化图清单（页码 + 类型 + prompt）\n\
          \    lines = []\n    for c in data[\"cards\"]:\n        page = c.get(\"\
          page\", \"?\")\n        ctype = c.get(\"type\", \"\")\n        heading =\
          \ c.get(\"heading\", \"\")\n        prompt = c.get(\"image_prompt_en\",\
          \ \"（缺 image_prompt_en）\")\n        lines.append(f\"【第{page}张 · {ctype}】{heading}\\\
          n{prompt}\\n\")\n    image_list = \"\\n\".join(lines)\n\n    # 输出干净的 JSON\
          \ 字符串 + 图清单\n    return {\n        \"result\": json.dumps(data, ensure_ascii=False),\n\
          \        \"image_list\": image_list\n    }"
