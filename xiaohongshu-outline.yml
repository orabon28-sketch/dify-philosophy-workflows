    - data:
        code: "import json, re\n\ndef main(arg1: str) -> dict:\n    s = arg1.strip()\n\
          \    # 去掉开头的 ```json 或 ``` 和结尾的 ```\n    s = re.sub(r\"^```(json)?\", \"\
          \", s).strip()\n    s = re.sub(r\"```$\", \"\", s).strip()\n    # 只截取第一个\
          \ { 到最后一个 } 之间的内容\n    start = s.find(\"{\")\n    end = s.rfind(\"}\")\n\
          \    if start != -1 and end != -1:\n        s = s[start:end + 1]\n\n   \
          \ # —— JSON 容错修复：LLM 偶尔输出不规范(如 tags 里漏引号)，先尝试直接解析，失败则修复后重试 ——\n    def _repair_json(text):\n\
          \        # 1) 修复 tags 数组里没加引号的裸标签项\n        def _fix_tags(m):\n        \
          \    inner = m.group(1)\n            items = [x.strip() for x in inner.split(\"\
          ,\") if x.strip()]\n            fixed = [json.dumps(it.strip().strip('\"\
          ').strip(), ensure_ascii=False) for it in items]\n            return '\"\
          tags\": [' + \", \".join(fixed) + \"]\"\n        text = re.sub(r'\"tags\"\
          \\s*:\\s*\\[(.*?)\\]', _fix_tags, text, flags=re.S)\n        # 2) 去掉对象/数组结尾多余的逗号(trailing\
          \ comma)\n        text = re.sub(r\",\\s*([\\]}])\", r\"\\1\", text)\n  \
          \      # 3) 去掉非法控制字符(未转义的制表符等)\n        text = re.sub(r\"[\\x00-\\x08\\\
          x0b\\x0c\\x0e-\\x1f]\", \"\", text)\n        return text\n\n    try:\n \
          \       data = json.loads(s)\n    except json.JSONDecodeError:\n       \
          \ data = json.loads(_repair_json(s))   # 修复后重试，仍失败则抛出原始报错\n\n    for k in\
          \ [\"title\", \"body\", \"tags\", \"cards\"]:\n        if k not in data:\n\
          \            raise ValueError(\"缺少字段: \" + k)\n\n    # —— 新增：版面结构校验，逼模型用新结构（圆点小标题\
          \ + 看点清单）——\n    for c in data[\"cards\"]:\n        ctype = c.get(\"type\"\
          , \"\")\n        page = c.get(\"page\", \"?\")\n        # 每张都得有画图三字段\n \
          \       for f in [\"icon_name\", \"image_prompt_cn\", \"image_prompt_en\"\
          ]:\n            if not c.get(f):\n                raise ValueError(f\"第{page}张[{ctype}]缺少画图字段:\
          \ {f}\")\n        if ctype == \"cover\":\n            if not c.get(\"hook\"\
          ):\n                raise ValueError(f\"第{page}张封面缺少 hook(画面中央的大字钩子句)\"\
          )\n            head = str(c.get(\"heading\", \"\"))\n            # heading\
          \ 应是流派名,不该是带引号的文案短语\n            if not head:\n                raise ValueError(f\"\
          第{page}张封面缺少 heading(流派/主义名)\")\n            if (\"“\" in head) or (\"”\"\
          \ in head) or ('\"' in head):\n                raise ValueError(f\"第{page}张封面\
          \ heading='{head}' 像文案短语,应填流派名(如 从众主义)\")\n            pts = c.get(\"points\"\
          )\n            if not (isinstance(pts, list) and len(pts) >= 3):\n     \
          \           raise ValueError(f\"第{page}张封面缺少 points(本期看点,需≥3条)\")\n    \
          \        ac = str(c.get(\"accent\", \"\"))\n            # accent 不该是宽泛学科名\n\
          \            for bad in [\"社会心理学\", \"心理学\", \"哲学\", \"社会学\", \"伦理学\"]:\n\
          \                if ac.strip() == bad or ac.strip() in (f\"{bad} · 哲学\"\
          , f\"{bad}·哲学\"):\n                    raise ValueError(f\"第{page}张封面 accent='{ac}'\
          \ 是学科名,应填具体流派/主义名(如 从众主义·阿希)\")\n        elif ctype == \"content\":\n  \
          \          if not c.get(\"subheading\"):\n                raise ValueError(f\"\
          第{page}张内容页缺少 subheading(标题下的副标题解释)\")\n            secs = c.get(\"sections\"\
          )\n            if not (isinstance(secs, list) and len(secs) == 3):\n   \
          \             raise ValueError(f\"第{page}张内容页 sections 必须是3个要点(收到 {secs!r})\"\
          )\n            for sec in secs:\n                if not sec.get(\"label\"\
          ) or not sec.get(\"text\"):\n                    raise ValueError(f\"第{page}张内容页某要点缺\
          \ label 或 text\")\n                # 解释太短往往说不清概念，提示加长（中文按字符数粗算）\n      \
          \          if len(str(sec.get(\"text\", \"\")).strip()) < 40:\n        \
          \            raise ValueError(f\"第{page}张内容页要点'{sec.get('label')}'的解释过短(不足40字),复杂概念容易说不清,请讲透\"\
          )\n\n    # 生成格式化图清单（页码 + 类型 + prompt）\n    lines = []\n    for c in data[\"\
          cards\"]:\n        page = c.get(\"page\", \"?\")\n        ctype = c.get(\"\
          type\", \"\")\n        heading = c.get(\"heading\", \"\")\n        prompt\
          \ = c.get(\"image_prompt_en\", \"（缺 image_prompt_en）\")\n        lines.append(f\"\
          【第{page}张 · {ctype}】{heading}\\n{prompt}\\n\")\n    image_list = \"\\n\"\
          .join(lines)\n\n    # 输出干净的 JSON 字符串 + 图清单\n    return {\n        \"result\"\
          : json.dumps(data, ensure_ascii=False),\n        \"image_list\": image_list\n\
          \    }\n"
