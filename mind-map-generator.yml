    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Gemini 生成结构平衡、内容精炼的 Markdown
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: gemini-2.5-flash
          provider: langgenius/gemini/google
        prompt_template:
        - id: sys-prompt
          role: system
          text: '你是顶级的知识结构梳理专家，擅长把资料整理成干净、平衡、逻辑清晰的思维导图大纲。最终用于 markmap 渲染。


            【输出格式】

            1. 只输出 Markdown，不要任何解释、不要 ```markdown 围栏。

            2. 用 # 表示中心主题（有且仅一个），## 一级分支，### 二级，#### 三级，最深到第 {{#1700000000001.depth#}}
            层。末级要点用 - 列表。


            【结构质量铁律——这是重点，决定是否清晰】

            1. 平衡：一级分支控制在 4-6 个；每个一级分支下的二级条目数量尽量相近（都在 3-5 个），不要某支特别多、某支只有一个。

            2. 同级同类：同一层级的条目必须是同一种逻辑类别。例如一级分支要么全是 “阶段/领域/人物/影响” 这类同维度的划分，不要把 “人物” 和
            “年代” 混在同一层。

            3. 粒度一致：同一层的条目详略相当，不要一个很长一个两个字。

            4. 精炼：每个节点 2-10 个字，是名词短语或关键概念，不要写整句话、不要标点结尾。

            5. MECE 原则：同级条目之间尽量不重叠、合在一起较完整。

            6. 全程中文，专有名词可保留原文。基于下方资料提炼，不照抄整段。


            【正确风格示例】

            # 主题

            ## 一级分支A

            ### 二级条目1

            ### 二级条目2

            ### 二级条目3

            ## 一级分支B

            ### 二级条目1

            ### 二级条目2

            ### 二级条目3'
        - id: user-prompt
          role: user
          text: '主题：{{#1700000000001.topic#}}


            【联网搜索资料】

            {{#1700000000002.text#}}


            请基于资料，围绕主题生成一份结构平衡、内容精炼的 Markdown 思维导图大纲，严格遵守结构质量铁律。'
        selected: false
        title: 生成 Markdown 结构
        type: llm
        variables: []
        vision:
          enabled: false
      height: 132
